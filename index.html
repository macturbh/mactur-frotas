<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MACTUR - Gestão de Frota</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00C853">
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00C853; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 4px; border: 1px solid #333; background: #2d2d2d; color: #fff; box-sizing: border-box; }
        button { background: #00C853; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; }
        button:hover { background: #00e676; }
    </style>
</head>
<body>

<div class="container">
    <h2>MACTUR - Abastecimento</h2>
    <form id="formAbastecimento">
        <label for="veiculo_id">Selecione o Veículo:</label>
        <select id="veiculo_id" required>
            <option value="">Carregando veículos...</option>
        </select>

        <label for="km_atual">KM Atual:</label>
        <input type="number" id="km_atual" step="0.01" placeholder="Ex: 18301" required>

        <label for="litros">Litros:</label>
        <input type="number" id="litros" step="0.01" placeholder="Ex: 50.00" required>

        <button type="submit">Salvar Abastecimento</button>
    </form>
</div>

<!-- Biblioteca do Supabase via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Seu arquivo de lógica -->
<script src="app.js"></script>

<script>
  // Registra o PWA Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('PWA Ativo!'))
        .catch(err => console.log('Erro ao registrar SW:', err));
    });
  }
</script>

</body>
</html>
